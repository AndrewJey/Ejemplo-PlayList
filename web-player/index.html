<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejemplo PlayList — Gestor Interactivo</title>
  <style>
    :root { --bg:#f4f7fb; --card:#fff; --text:#122033; --muted:#5c6b80; --border:#d8e1ec; --primary:#2563eb; --danger:#dc2626; }
    [data-theme="dark"] { --bg:#0b1220; --card:#131f33; --text:#eef4fb; --muted:#97abc5; --border:#233452; --primary:#60a5fa; --danger:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); transition:background .2s,color .2s; }
    .wrap { max-width:900px; margin:0 auto; padding:24px 16px 64px; }
    .top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
    input, button { font:inherit; padding:9px 12px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
    button { cursor:pointer; font-weight:600; }
    .btn-primary { background:var(--primary); color:#fff; border-color:transparent; }
    .btn-danger { background:var(--danger); color:#fff; border-color:transparent; }
    .track { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; padding:12px; border-bottom:1px solid var(--border); }
    .track.is-playing { background:rgba(37,99,235,.12); border-radius:10px; }
    .muted { color:var(--muted); font-size:13px; }
    .actions { display:flex; gap:6px; flex-wrap:wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1 style="margin:0;">🎵 Ejemplo PlayList</h1>
        <div class="muted" id="stats"></div>
      </div>
      <button type="button" id="themeBtn">🌙 Tema</button>
    </div>

    <div class="card">
      <div id="nowPlaying" style="font-weight:700;margin-bottom:8px;">Selecciona una pista para reproducir</div>
      <div class="actions">
        <button type="button" id="prevBtn">⏮ Anterior</button>
        <button type="button" id="playPauseBtn" class="btn-primary">▶ Reproducir</button>
        <button type="button" id="nextBtn">⏭ Siguiente</button>
      </div>
    </div>

    <form id="trackForm" class="card">
      <h3 style="margin-top:0;">Agregar pista</h3>
      <div class="grid">
        <input id="title" required placeholder="Título *" />
        <input id="artist" required placeholder="Artista *" />
        <input id="album" placeholder="Álbum" />
        <input id="duration" type="number" min="1" value="210" placeholder="Segundos" />
      </div>
      <div style="margin-top:10px;">
        <button type="submit" class="btn-primary">+ Agregar a la playlist</button>
      </div>
    </form>

    <div class="card">
      <input id="search" type="search" placeholder="Buscar por título, artista o álbum..." style="width:100%;margin-bottom:12px;" />
      <div id="list"></div>
    </div>
  </div>

  <script>
    (function () {
      var KEY = 'ejemplo_playlist_tracks_v1';
      var THEME = 'ejemplo_playlist_theme';
      var seed = [
        { id: 't1', title: 'Música Ligera', artist: 'Soda Stereo', album: 'Canción Animal', duration: 212 },
        { id: 't2', title: 'Persiana Americana', artist: 'Soda Stereo', album: 'Signos', duration: 293 },
        { id: 't3', title: 'Rayando el Sol', artist: 'Maná', album: 'Falta Amor', duration: 254 }
      ];
      var tracks = [];
      try { tracks = JSON.parse(localStorage.getItem(KEY) || 'null') || seed.slice(); } catch (e) { tracks = seed.slice(); }
      var currentIdx = 0, playing = false;

      function save() { try { localStorage.setItem(KEY, JSON.stringify(tracks)); } catch (e) {} }
      function fmt(sec) { var s = Math.max(0, Number(sec) || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
      function esc(v) { return String(v || '').replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

      function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        try { localStorage.setItem(THEME, t); } catch (e) {}
        document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
      }
      applyTheme(localStorage.getItem(THEME) === 'dark' ? 'dark' : 'light');
      document.getElementById('themeBtn').addEventListener('click', function () {
        applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });

      function render() {
        var q = document.getElementById('search').value.trim().toLowerCase();
        var total = tracks.reduce(function (acc, t) { return acc + (Number(t.duration) || 0); }, 0);
        document.getElementById('stats').textContent = tracks.length + ' pistas · Duración total ' + fmt(total);
        var cur = tracks[currentIdx];
        document.getElementById('nowPlaying').textContent = cur
          ? (playing ? '▶ Reproduciendo: ' : '⏸ En pausa: ') + cur.title + ' — ' + cur.artist + ' (' + fmt(cur.duration) + ')'
          : 'Lista vacía';
        document.getElementById('playPauseBtn').textContent = playing ? '⏸ Pausar' : '▶ Reproducir';

        var list = document.getElementById('list');
        var rows = tracks.map(function (t, i) { return { t: t, i: i }; }).filter(function (x) {
          return !q || (x.t.title + ' ' + x.t.artist + ' ' + x.t.album).toLowerCase().indexOf(q) >= 0;
        });
        list.innerHTML = rows.length ? rows.map(function (x) {
          return '<div class="track' + (x.i === currentIdx ? ' is-playing' : '') + '">' +
            '<div><strong>' + esc(x.t.title) + '</strong><div class="muted">' + esc(x.t.artist) + (x.t.album ? ' · ' + esc(x.t.album) : '') + ' · ' + fmt(x.t.duration) + '</div></div>' +
            '<div class="actions">' +
              '<button type="button" data-play="' + x.i + '">▶</button>' +
              '<button type="button" data-up="' + x.i + '">↑</button>' +
              '<button type="button" data-down="' + x.i + '">↓</button>' +
              '<button type="button" class="btn-danger" data-del="' + x.i + '">✕</button>' +
            '</div></div>';
        }).join('') : '<div class="muted">No hay pistas que coincidan.</div>';
      }

      document.getElementById('trackForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var title = document.getElementById('title').value.trim();
        var artist = document.getElementById('artist').value.trim();
        if (!title || !artist) return;
        tracks.push({
          id: 't' + Date.now(),
          title: title,
          artist: artist,
          album: document.getElementById('album').value.trim(),
          duration: Math.max(1, parseInt(document.getElementById('duration').value, 10) || 180)
        });
        save(); this.reset(); document.getElementById('duration').value = '210'; render();
      });

      document.getElementById('search').addEventListener('input', render);
      document.getElementById('playPauseBtn').addEventListener('click', function () { if (tracks.length) { playing = !playing; render(); } });
      document.getElementById('prevBtn').addEventListener('click', function () { if (tracks.length) { currentIdx = (currentIdx - 1 + tracks.length) % tracks.length; playing = true; render(); } });
      document.getElementById('nextBtn').addEventListener('click', function () { if (tracks.length) { currentIdx = (currentIdx + 1) % tracks.length; playing = true; render(); } });
      document.getElementById('list').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.dataset.play != null) { currentIdx = Number(b.dataset.play); playing = true; render(); }
        else if (b.dataset.up != null) { var i = Number(b.dataset.up); if (i > 0) { var tmp = tracks[i - 1]; tracks[i - 1] = tracks[i]; tracks[i] = tmp; save(); render(); } }
        else if (b.dataset.down != null) { var j = Number(b.dataset.down); if (j < tracks.length - 1) { var tmp2 = tracks[j + 1]; tracks[j + 1] = tracks[j]; tracks[j] = tmp2; save(); render(); } }
        else if (b.dataset.del != null) { var k = Number(b.dataset.del); tracks.splice(k, 1); if (currentIdx >= tracks.length) currentIdx = Math.max(0, tracks.length - 1); save(); render(); }
      });
      render();
    })();
  </script>
</body>
</html>
